{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">{{ accion }} producto</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre</label>
                            {{ form.nombre }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción</label>
                            {{ form.descripcion }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.precio.id_for_label }}" class="form-label">Precio</label>
                            {{ form.precio }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.stock.id_for_label }}" class="form-label">Stock</label>
                            {{ form.stock }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.imagen.id_for_label }}" class="form-label">Imagen</label>
                            {{ form.imagen }}
                        </div>
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
