<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="alert alert-warning">
        <h4 class="alert-heading">¿Estás seguro?</h4>
        <p>Estás a punto de <strong>eliminar esta cuenta</strong>. Esta acción no se puede deshacer.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar la cuenta</button>
        <a href="{% url destino_cancelar %}" class="btn btn-secondary">Cancelar</a>

    </form>

</body>
</html>
