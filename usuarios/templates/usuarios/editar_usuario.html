<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-section { display: none; }
    </style>
</head>
<body class="container mt-5">

    <h2 class="mb-4">¿Qué deseas cambiar?</h2>

    <div class="mb-4">
        <button class="btn btn-outline-primary me-2" onclick="mostrar('username')">Nombre de usuario</button>
        <button class="btn btn-outline-primary me-2" onclick="mostrar('email')">Correo electrónico</button>
        <button class="btn btn-outline-primary" onclick="mostrar('password')">Contraseña</button>
    </div>

    <form method="post" class="border p-4 rounded shadow-sm bg-light">
        {% csrf_token %}

        <!-- Cambiar nombre -->
        <div id="username" class="form-section">
            <div class="mb-3">
                <label class="form-label">Nuevo nombre de usuario:</label>
                <input type="text" name="username" class="form-control" value="{{ usuario.username }}">
            </div>
        </div>

        <!-- Cambiar email -->
        <div id="email" class="form-section">
            <div class="mb-3">
                <label class="form-label">Nuevo correo electrónico:</label>
                <input type="email" name="email" class="form-control" value="{{ usuario.email }}">
            </div>
        </div>

        <!-- Cambiar contraseña -->
        <div id="password" class="form-section">
            <div class="mb-3">
                <label class="form-label">Nueva contraseña:</label>
                <input type="password" name="password1" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar contraseña:</label>
                <input type="password" name="password2" class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="{{ volver_url }}" class="btn btn-secondary mt-3">Cancelar</a>

    </form>

    <script>
        function mostrar(id) {
            document.querySelectorAll('.form-section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(id).style.display = 'block';
        }
    </script>

</body>
</html>
